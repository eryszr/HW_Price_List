<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register</title>

<link rel="stylesheet" href="../CSS/styles_Register.css">
</head>


<body>
  <div class="card">
    <div class="header">
      <h1>Create Account</h1>
      <p class="subtitle">Request access by filling in the form below.</p>
    </div>

    <form action="https://formspree.io/f/mdawrbpj" method="POST">

      <div class="row">
        <div class="field">
          <label for="name">First Name</label>
          <input type="text" id="name" name="name" placeholder="Jane" required>
        </div>
        <div class="field">
          <label for="surname">Last Name</label>
          <input type="text" id="surname" name="surname" placeholder="Doe" required>
        </div>
      </div>

      <div class="field">
        <label for="company">Company</label>
        <input type="text" id="company" name="company_name" placeholder="Acme Corp">
      </div>

      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="jane@acme.com" required>
      </div>

      <hr class="divider">

      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="jane_doe" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <button type="submit">Send Request</button>
    </form>

    <p class="footer-note">Your information is kept private and never shared.</p>
  </div>

</body>
</html>
