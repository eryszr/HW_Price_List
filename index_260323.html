<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keyword" content="Honeywell Product List">
  <title>Honeywell Product List</title>
  <link rel="stylesheet" href="CSS/styles_Index.css">
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img src="https://eryszr.github.io/HW_Price_List/img/Logo_honeywell.svg.png" alt="Honeywell Logo">
    <h1>Honeywell 2026 Product List</h1>
  </div>
  <hr>

  <div class="container">

    <!-- Controllers & Modules -->
    <div class="group">
      <div class="group-label">Controllers & Modules</div>
      <div class="btn-row">
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/supervisor.html'">Supervisor</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/controller.html'">Controller</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/iomodule.html'">I/O Module</button>
      </div>
    </div>

    <!-- Valves & Actuators -->
    <div class="group">
      <div class="group-label">Valves & Actuators</div>
      <div class="btn-row">
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/ballRotaryValveActuator.html'">Ball & Rotary Valve & Actuator</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/lineerValveActuator.html'">Lineer Valves & Actuator</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/smallLineerValveActutor.html'">Small Lineer Valves & Actuator</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/butterflyValveActuator.html'">Butterfly Valves & Actuator</button>
      </div>
    </div>

    <!-- Damper Actuators -->
    <div class="group">
      <div class="group-label">Damper Actuators</div>
      <div class="btn-row">
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/damperActuator.html'">Damper Actuator</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/fireSmokeActuator.html'">Fire & Smoke Damper Actuator</button>
      </div>
    </div>

    <!-- Sensors -->
    <div class="group">
      <div class="group-label">Sensors</div>
      <div class="btn-row">
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/temperatureSensor.html'">Temperature Sensor</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/temperatureHumiditySensor.html'">Temperature & Humidity Sensor</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/pressureSensorSwitch.html'">Pressure Sensor</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/airQualitySensor.html'">Air Quality Sensor</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/frostThermostats.html'">Frost Thermostats</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/other.html'">Other</button>
      </div>
    </div>

    <!-- Other Products -->
    <div class="group">
      <div class="group-label">Other Products</div>
      <div class="btn-row">
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/frequencyInverter.html'">Frequency Inverter</button>
        <button class="btn" onclick="document.location='https://eryszr.github.io/HW_Price_List/pages/VAV.html'">VAV</button>
      </div>
    </div>

  </div>

</body>
</html>
